name: Windows build

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt || true

      - name: Run build script
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\_build.ps1

      - name: Show produced files
        shell: pwsh
        run: |
          if (Test-Path .\dist) { Get-ChildItem -Recurse -Force .\dist | Format-Table -AutoSize } else { Write-Host "No dist folder found." }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyautokey-dist
          path: dist/**/*