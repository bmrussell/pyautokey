name: Windows Release

on:
  push:
    tags:
      - 'v*'  # trigger on version tags like v1.2.3

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt || true

      - name: Run build script
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\_build.ps1

      - name: Show produced files
        shell: pwsh
        run: |
          if (Test-Path .\dist) { Get-ChildItem -Recurse -Force .\dist | Format-Table -AutoSize } else { Write-Host "No dist folder found." }

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: Automated release from CI
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find built .exe
        id: find_artifact
        shell: pwsh
        run: |
          $file = Get-ChildItem -Path .\dist -Recurse -Filter *.exe | Select-Object -First 1
          if (-not $file) { Write-Error "No .exe found in dist"; exit 1 }
          echo "path=$($file.FullName)" >> $env:GITHUB_OUTPUT
          echo "name=$($file.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.find_artifact.outputs.path }}
          asset_name: ${{ steps.find_artifact.outputs.name }}
          asset_content_type: application/octet-stream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}